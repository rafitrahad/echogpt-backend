services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: echogpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433 on your machine, so it doesn't clash with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echogpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # wait until PostgreSQL accepts connections
    env_file: .env
    environment:
      # These override the values in .env for the container setup
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/echogpt
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  pgdata: